apiVersion: v1
data:
  anamnesis.json: |
    {
      "title": "Anamnesis API",
      "uid": "anamnesis-api",
      "editable": true,
      "refresh": "30s",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {"id":1,"type":"stat","title":"Outbox Backlog","gridPos":{"x":0,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"targets":[{"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"expr":"sum(outbox_backlog)","refId":"A"}]},
        {"id":2,"type":"stat","title":"API Replicas Up","gridPos":{"x":6,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"targets":[{"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"expr":"count(up{job=\"anamnesis\"} == 1)","refId":"A"}]},
        {"id":3,"type":"timeseries","title":"CPU Seconds / sec","gridPos":{"x":12,"y":0,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"targets":[{"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"expr":"rate(process_cpu_seconds_total{job=\"anamnesis\"}[5m])","legendFormat":"{{instance}}","refId":"A"}]},
        {"id":4,"type":"timeseries","title":"Resident Memory (MB)","gridPos":{"x":0,"y":5,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"targets":[{"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"expr":"process_resident_memory_bytes{job=\"anamnesis\"} / 1024 / 1024","legendFormat":"{{instance}}","refId":"A"}]},
        {"id":5,"type":"timeseries","title":"Open File Descriptors","gridPos":{"x":12,"y":8,"w":12,"h":5},"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"targets":[{"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"expr":"process_open_fds{job=\"anamnesis\"}","legendFormat":"{{instance}}","refId":"A"}]},
        {"id":6,"type":"timeseries","title":"Threads","gridPos":{"x":0,"y":13,"w":12,"h":5},"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"targets":[{"datasource":{"type":"prometheus","uid":"PBFA97CFB590B2093"},"expr":"process_threads{job=\"anamnesis\"}","legendFormat":"{{instance}}","refId":"A"}]}
      ]
    }
  hospital.json: |
    {
      "title": "Hospital Data",
      "uid": "hospital-data",
      "editable": true,
      "refresh": "30s",
      "schemaVersion": 39,
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {"id":1,"type":"stat","title":"Total Patients","gridPos":{"x":0,"y":0,"w":6,"h":5},"datasource":{"type":"postgres","uid":"anamnesisdb"},"targets":[{"datasource":{"type":"postgres","uid":"anamnesisdb"},"rawSql":"SELECT count(*) AS value FROM patients;","format":"table","refId":"A"}]},
        {"id":2,"type":"stat","title":"Hospitals","gridPos":{"x":6,"y":0,"w":6,"h":5},"datasource":{"type":"postgres","uid":"anamnesisdb"},"targets":[{"datasource":{"type":"postgres","uid":"anamnesisdb"},"rawSql":"SELECT count(*) AS value FROM hospitals;","format":"table","refId":"A"}]},
        {"id":3,"type":"piechart","title":"Patients per Hospital","gridPos":{"x":12,"y":0,"w":12,"h":8},"datasource":{"type":"postgres","uid":"anamnesisdb"},"targets":[{"datasource":{"type":"postgres","uid":"anamnesisdb"},"rawSql":"SELECT h.name AS metric, count(p.id) AS value FROM hospitals h LEFT JOIN patients p ON p.hospital_id = h.id GROUP BY h.name;","format":"table","refId":"A"}]},
        {"id":4,"type":"barchart","title":"By Blood Type","gridPos":{"x":0,"y":5,"w":12,"h":8},"datasource":{"type":"postgres","uid":"anamnesisdb"},"targets":[{"datasource":{"type":"postgres","uid":"anamnesisdb"},"rawSql":"SELECT blood_type AS metric, count(*) AS value FROM patients GROUP BY blood_type ORDER BY blood_type;","format":"table","refId":"A"}]},
        {"id":5,"type":"barchart","title":"By Sex","gridPos":{"x":12,"y":8,"w":12,"h":5},"datasource":{"type":"postgres","uid":"anamnesisdb"},"targets":[{"datasource":{"type":"postgres","uid":"anamnesisdb"},"rawSql":"SELECT sex AS metric, count(*) AS value FROM patients GROUP BY sex;","format":"table","refId":"A"}]},
        {"id":6,"type":"table","title":"Recent Patients","gridPos":{"x":0,"y":13,"w":24,"h":9},"datasource":{"type":"postgres","uid":"anamnesisdb"},"targets":[{"datasource":{"type":"postgres","uid":"anamnesisdb"},"rawSql":"SELECT mrn, full_name, sex, blood_type, birth_date FROM patients ORDER BY created_at DESC LIMIT 50;","format":"table","refId":"A"}]}
      ]
    }
  nodes.json: |
    {
      "title": "Node Resources",
      "uid": "node-resources",
      "editable": true,
      "refresh": "30s",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "title": "CPU Usage % (per node)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "title": "Memory Used %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "title": "Disk Used % (root)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "100 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"} * 100)", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "title": "Network Receive (bytes/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])", "legendFormat": "{{instance}} {{device}}" }
          ]
        },
        {
          "title": "Load Average (1m)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "node_load1", "legendFormat": "{{instance}}" }
          ]
        }
      ]
    }
