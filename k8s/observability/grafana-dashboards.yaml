apiVersion: v1
data:
  anamnesis.json: |
    {
      "title": "Anamnesis API",
      "uid": "anamnesis-api",
      "editable": true,
      "refresh": "30s",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "title": "Requests / sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "sum(rate(http_request_duration_seconds_count[5m]))", "legendFormat": "requests/s" }
          ]
        },
        {
          "title": "5xx errors / sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "sum(rate(http_errors_total[5m]))", "legendFormat": "errors/s" }
          ]
        },
        {
          "title": "p95 latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95" }
          ]
        },
        {
          "title": "Up targets",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "up", "legendFormat": "{{job}}" }
          ]
        }
      ]
    }
  nodes.json: |
    {
      "title": "Node Resources",
      "uid": "node-resources",
      "editable": true,
      "refresh": "30s",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "title": "CPU Usage % (per node)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "title": "Memory Used %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "title": "Disk Used % (root)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "100 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"} * 100)", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "title": "Network Receive (bytes/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])", "legendFormat": "{{instance}} {{device}}" }
          ]
        },
        {
          "title": "Load Average (1m)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "targets": [
            { "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "node_load1", "legendFormat": "{{instance}}" }
          ]
        }
      ]
    }
  postgres.json: |
    {
      "title": "Postgres Overview",
      "uid": "anamnesis-pg",
      "timezone": "browser",
      "editable": true,
      "refresh": "30s",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Connections",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "sum(pg_stat_database_numbackends)", "refId": "A"}]
        },
        {
          "id": 2, "type": "stat", "title": "Cache Hit Ratio %",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "sum(pg_stat_database_blks_hit)/(sum(pg_stat_database_blks_hit)+sum(pg_stat_database_blks_read))*100", "refId": "A"}]
        },
        {
          "id": 3, "type": "stat", "title": "Postgres Up",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "pg_up", "refId": "A"}]
        },
        {
          "id": 4, "type": "timeseries", "title": "Commits / sec",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "sum(rate(pg_stat_database_xact_commit[5m]))", "legendFormat": "commits/s", "refId": "A"}]
        },
        {
          "id": 5, "type": "timeseries", "title": "Rollbacks / sec",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "expr": "sum(rate(pg_stat_database_xact_rollback[5m]))", "legendFormat": "rollbacks/s", "refId": "A"}]
        }
      ]
    }
kind: ConfigMap
