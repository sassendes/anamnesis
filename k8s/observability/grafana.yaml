---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
      - name: Postgres Exporter
        type: prometheus
        access: proxy
        url: http://prometheus:9090
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: default
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: anamnesis
        orgId: 1
        folder: anamnesis
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
  anamnesis.json: |
    {
      "title": "Anamnesis API",
      "uid": "anamnesis-api",
      "editable": true,
      "refresh": "30s",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "title": "Requests / sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_request_duration_seconds_count[5m]))", "legendFormat": "requests/s" }
          ]
        },
        {
          "title": "5xx errors / sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_errors_total[5m]))", "legendFormat": "errors/s" }
          ]
        },
        {
          "title": "p95 latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95" }
          ]
        },
        {
          "title": "Up targets",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "up", "legendFormat": "{{job}}" }
          ]
        }
      ]
    }
  postgres.json: |
    {"title": "Postgres Overview", "uid": "anamnesis-pg", "timezone": "browser", "editable": true, "refresh": "30s", "schemaVersion": 39, "version": 1, "panels": [{"id": 1, "type": "stat", "title": "Connections", "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4}, "targets": [{"expr": "sum(pg_stat_database_numbackends)"}]}, {"id": 2, "type": "stat", "title": "Cache Hit Ratio", "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4}, "targets": [{"expr": "sum(pg_stat_database_blks_hit)/(sum(pg_stat_database_blks_hit)+sum(pg_stat_database_blks_read))*100"}]}, {"id": 3, "type": "stat", "title": "WAL Written", "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4}, "targets": [{"expr": "sum(rate(pg_wal_wal_bytes[5m]))"}]}, {"id": 4, "type": "graph", "title": "Commit / Rollback", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 6}, "targets": [{"expr": "sum(rate(pg_stat_database_xact_commit[5m]))"}, {"expr": "sum(rate(pg_stat_database_xact_rollback[5m]))"}]}, {"id": 5, "type": "graph", "title": "Temp Files", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 6}, "targets": [{"expr": "sum(rate(pg_stat_database_temp_files[5m]))"}]}, {"id": 6, "type": "table", "title": "Top Queries (pg_stat_statements)", "gridPos": {"x": 0, "y": 10, "w": 24, "h": 8}, "targets": [{"expr": "pg_stat_statements_top"}]}]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider