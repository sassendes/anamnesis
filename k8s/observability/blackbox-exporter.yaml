apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      serviceAccountName: prometheus
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.25.0
          ports:
            - name: probe
              containerPort: 9115
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: default
spec:
  selector:
    app: blackbox-exporter
  ports:
    - name: probe
      port: 9115
      targetPort: probe
