apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anamnesis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GH_USER/anamnesis.git
    path: k8s
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true


