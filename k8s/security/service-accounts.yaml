  name: minio
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anamnesis-backup
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
