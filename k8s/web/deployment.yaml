apiVersion: apps/v1
kind: Deployment
metadata:
  name: anamnesis-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anamnesis-web
  template:
    metadata:
      labels:
        app: anamnesis-web
    spec:
      serviceAccountName: anamnesis-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: anamnesis-web
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: anamnesis-web
      containers:
        - name: web
          image: anamnesis-web:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: anamnesis-web
  namespace: default
spec:
  selector:
    app: anamnesis-web
  ports:
    - name: http
      port: 80
      targetPort: http